name: Regression tests

on:
  push:
    branches:
      - main
      - mobile-reliability-pass
      - preview-sideline-calibration
      - post-session-review-dashboard-actions-v3
      - sideline-glance-layout-v7
      - fast-save-session-library
      - session-usability-refresh-editor-pass
      - builder-session-visuals
      - sticky-session-diagrams
      - sticky-session-diagrams-fix
      - sticky-diagram-viewer-fix
      - session-editor-focus-fix
      - editor-clean-drag-pitch-revamp
      - diagram-selection-copy-tools
      - diagram-studio-v2-overhaul
      - bulletproof-diagram-editor
      - diagram-editor-selection-line-pass
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/mobile-reliability.js
      - run: node --check src/display-calibration.js
      - run: node --check src/post-session-review.js
      - run: node --check src/review-integrations.js
      - run: node --check src/sideline-glance-layout.js
      - run: node --check src/session-library-speed-v2.js
      - run: node --check src/startup-performance.js
      - run: node --check src/session-usability-pass.js
      - run: node --check src/practice-editor-unified.js
      - run: node --check src/builder-session-visuals.js
      - run: node --check src/sticky-session-diagrams-fix.js
      - run: node --check src/sticky-editor-return.js
      - run: node --check src/practice-editor-interaction-revamp.js
      - run: node --check src/diagram-group-copy-tools.js
      - run: node --check src/practice-editor-studio-v2.js
      - run: node --check src/diagram-editor-coach-workflow.js
      - run: node --check src/diagram-editor-pickup-line-pass.js
      - run: git diff --check
