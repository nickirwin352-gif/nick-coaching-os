name: Stability hardening

on:
  push:
    branches:
      - stability-hardening-pass

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-hardening-pass
      - name: Apply stability patch if needed
        shell: bash
        run: |
          if grep -q 'src="./src/firebase-cloud.js"' index.html && grep -q 'diagramOverrides:copyPlannerDiagramOverrides()' index.html; then
            echo "Core stability hardening is already applied."
          else
            python tools/apply-stability-hardening.py
          fi
      - name: Apply render hardening if needed
        shell: bash
        run: |
          if grep -q 'function escapeJsSingleQuoted(value)' index.html && grep -q 'removeAllPractices(sessionDrillIds(s),s.diagramOverrides' index.html; then
            echo "Render hardening is already applied."
          else
            python tools/apply-render-hardening.py
          fi
      - name: Check extracted Firebase syntax
        run: node --check src/firebase-cloud.js
      - name: Run regression tests
        run: npm test
      - name: Check whitespace errors
        run: git diff --check
      - name: Commit generated app changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html src/firebase-cloud.js legacy/index-pre-unified-editor.html
          git commit -m "Harden rendered coaching data"
          git push origin HEAD:stability-hardening-pass
